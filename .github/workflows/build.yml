name: Build/release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布到的 Release 标签(已存在则直接使用,留空则只构建不发布)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        arch: [x64, arm64]
      max-parallel: 3
    env:
      M_ARCH: ${{ matrix.arch }}
      USE_HARD_LINKS: "false"
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Linux Lib
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libxrender-dev libxmu-dev libxmuu-dev rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eSearch-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/*.exe
            build/*.zip
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.exe
            build/*.zip
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(inputs.tag, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}